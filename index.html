<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wind Style Rasen Shuriken</title>
<style>
  :root {
    --ui-bg: rgba(0, 0, 0, 0.45);
    --ui-border: rgba(255, 255, 255, 0.16);
    --ui-text: #f4f7fb;
    --ui-muted: rgba(255, 255, 255, 0.72);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #000; color: var(--ui-text);
    font-family: Arial, Helvetica, sans-serif;
  }
  #app { position: fixed; inset: 0; overflow: hidden; background: #000; }
  #camera {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); background: #000;
  }
  #fx {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .panel {
    position: absolute; z-index: 5; padding: 12px 14px; border-radius: 16px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    backdrop-filter: blur(10px); line-height: 1.4;
  }
  #styles {
    left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 8px; flex-wrap: nowrap; justify-content: center;
    max-width: calc(100vw - 24px); overflow-x: auto;
  }
  .style-btn {
    appearance: none; border: 1px solid var(--ui-border); cursor: pointer;
    background: rgba(255, 255, 255, 0.06); color: var(--ui-text);
    font-size: 12px; font-weight: 700; letter-spacing: 0.3px;
    padding: 6px 11px; border-radius: 999px; white-space: nowrap;
  }
  .style-btn small { display: block; font-weight: 400; font-size: 10px; color: var(--ui-muted); letter-spacing: 0; }
  .style-btn.active { border-color: rgba(255, 255, 255, 0.65); background: rgba(255, 255, 255, 0.16); }
  .style-btn[data-style="magnetShuriken"].active { box-shadow: 0 0 18px rgba(70, 130, 255, 0.55); }
  .style-btn[data-style="lavaShuriken"].active { box-shadow: 0 0 18px rgba(255, 110, 30, 0.55); }
  .style-btn[data-style="classic"].active { box-shadow: 0 0 18px rgba(140, 210, 255, 0.55); }
  .style-btn[data-style="shuriken"].active { box-shadow: 0 0 18px rgba(170, 240, 255, 0.6); }
  .style-btn[data-style="dual"].active { box-shadow: 0 0 18px rgba(150, 120, 255, 0.65); }
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="fx"></canvas>

  <div id="styles" class="panel">
    <button class="style-btn active" data-style="classic">1 · Classic<small>Wind blue Rasengan</small></button>
    <button class="style-btn" data-style="shuriken">2 · Wind Shuriken<small>Rasenshuriken</small></button>
    <button class="style-btn" data-style="magnetShuriken">3 · Magnet Shuriken<small>Jiton Rasenshuriken</small></button>
    <button class="style-btn" data-style="lavaShuriken">4 · Lava Shuriken<small>Yoton Rasenshuriken</small></button>
    <button class="style-btn" data-style="dual">5 · Dual<small>Two hands: Magnet + Lava</small></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
(function () {
  "use strict";

  var lastStatus = "";
  function setStatus(t) {
    // No status panel on screen anymore; instructions live in the README.
    lastStatus = t;
  }

  // ============================================================
  // Surfaces, drawn in code from the reference images.
  // Classic: chaotic thin filaments, white, blue and gold.
  // Magnet: bright blue tiled with the real seal pattern, a ring
  // with a dot inside it, copied from the sphere Naruto holds.
  // Lava: bright molten orange, big hot areas, thin dark crust.
  // ============================================================
  function makeCanvas(w, h) {
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    return c;
  }

  function blob(ctx, W, x, y, r, color, alpha) {
    for (var k = -1; k <= 1; k++) {
      var gx = x + k * W;
      var g = ctx.createRadialGradient(gx, y, 0, gx, y, r);
      g.addColorStop(0, color);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = g;
      ctx.fillRect(gx - r, y - r, r * 2, r * 2);
      ctx.restore();
    }
  }

  function grain(ctx, W, H, n, color, alpha, maxR) {
    ctx.fillStyle = color;
    for (var i = 0; i < n; i++) {
      ctx.save();
      ctx.globalAlpha = Math.random() * alpha;
      ctx.beginPath();
      ctx.arc(Math.random() * W, Math.random() * H, Math.random() * maxR + 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function windTexture(hot) {
    var W = 1024, H = 512, c = makeCanvas(W, H), ctx = c.getContext("2d");
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, hot ? "#8fd0ff" : "#6db9f7");
    grad.addColorStop(0.5, hot ? "#4db2ff" : "#2f8fe8");
    grad.addColorStop(1, hot ? "#2b7de0" : "#1763b8");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    var i;
    for (i = 0; i < 46; i++) blob(ctx, W, Math.random() * W, Math.random() * H, 30 + Math.random() * 80, "#bfe6ff", 0.20);
    // Chaotic filaments: thin arcs in every direction, tangled like
    // the energy threads in the reference
    var cols = ["#ffffff", "#eaf7ff", "#cfeaff", "#ffe9a8"];
    var colW = [0.42, 0.28, 0.18, 0.12];
    for (i = 0; i < 300; i++) {
      var cx = Math.random() * W, cy = Math.random() * H;
      var r = 26 + Math.random() * 170;
      var a0 = Math.random() * Math.PI * 2;
      var span = 0.6 + Math.random() * 2.2;
      var colr = cols[0], acc = 0, pick = Math.random();
      for (var ci = 0; ci < cols.length; ci++) { acc += colW[ci]; if (pick <= acc) { colr = cols[ci]; break; } }
      ctx.strokeStyle = colr;
      ctx.lineCap = "round";
      for (var k = -1; k <= 1; k++) {
        ctx.save();
        ctx.globalAlpha = 0.10 + Math.random() * 0.22;
        ctx.lineWidth = 1 + Math.random() * 2.6;
        ctx.beginPath();
        ctx.arc(cx + k * W, cy, r, a0, a0 + span);
        ctx.stroke();
        ctx.restore();
      }
    }
    for (i = 0; i < 26; i++) blob(ctx, W, W * 0.5 + (Math.random() - 0.5) * 260, H * 0.5 + (Math.random() - 0.5) * 150, 16 + Math.random() * 42, "#ffffff", 0.30);
    grain(ctx, W, H, 350, "#ffffff", 0.3, 1.8);
    return new THREE.CanvasTexture(c);
  }

  // The real Magnet seal: a dark ring with a dot inside it, the
  // pattern tiled over the sphere Naruto holds in Six Paths mode.
  function sealMark(ctx, x, y, r, color, inner, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = inner;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.24, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function magnetTexture() {
    var W = 1024, H = 512, c = makeCanvas(W, H), ctx = c.getContext("2d");
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#55a0ff");
    grad.addColorStop(0.5, "#2f7bff");
    grad.addColorStop(1, "#1c56d6");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    var i, k;
    for (i = 0; i < 40; i++) blob(ctx, W, Math.random() * W, Math.random() * H, 34 + Math.random() * 70, "#bcd6ff", 0.22);
    // Pale energy swirls under the seals
    ctx.strokeStyle = "#dceaff";
    ctx.lineCap = "round";
    for (i = 0; i < 90; i++) {
      var sx = Math.random() * W, sy = Math.random() * H;
      var sr = 16 + Math.random() * 40, sa = Math.random() * Math.PI * 2;
      for (k = -1; k <= 1; k++) {
        ctx.save();
        ctx.globalAlpha = 0.13 + Math.random() * 0.1;
        ctx.lineWidth = 2 + Math.random() * 3;
        ctx.beginPath();
        ctx.arc(sx + k * W, sy, sr, sa, sa + 1.2 + Math.random());
        ctx.stroke();
        ctx.restore();
      }
    }
    // The seal pattern itself: ring and dot marks of one consistent
    // size, tiled evenly over the whole surface
    var cols = 13, rows = 7;
    for (var gy = 0; gy < rows; gy++) {
      for (var gx = 0; gx < cols; gx++) {
        var px = (gx + 0.5) * (W / cols) + (Math.random() - 0.5) * 16;
        var py = (gy + 0.5) * (H / rows) + (Math.random() - 0.5) * 12;
        var pr = 12 + Math.random() * 3;
        for (k = -1; k <= 1; k++) sealMark(ctx, px + k * W, py, pr, "#0a1440", "#3d8bff", 0.92);
      }
    }
    grain(ctx, W, H, 300, "#bcd6ff", 0.25, 1.6);
    return new THREE.CanvasTexture(c);
  }

  function lavaTexture() {
    var W = 1024, H = 512, c = makeCanvas(W, H), ctx = c.getContext("2d");
    ctx.fillStyle = "#9c2a00";
    ctx.fillRect(0, 0, W, H);
    var i, x, y;
    for (i = 0; i < 70; i++) blob(ctx, W, Math.random() * W, Math.random() * H, 70 + Math.random() * 150, "#d64a00", 0.5);
    for (i = 0; i < 90; i++) blob(ctx, W, Math.random() * W, Math.random() * H, 44 + Math.random() * 100, "#ff7b00", 0.5);
    for (i = 0; i < 150; i++) blob(ctx, W, Math.random() * W, Math.random() * H, 18 + Math.random() * 52, "#ffa63f", 0.6);
    for (i = 0; i < 130; i++) blob(ctx, W, Math.random() * W, Math.random() * H, 10 + Math.random() * 30, "#ffd23f", 0.7);
    for (i = 0; i < 90; i++) blob(ctx, W, Math.random() * W, Math.random() * H, 6 + Math.random() * 18, "#fff3c4", 0.8);
    for (i = 0; i < 34; i++) blob(ctx, W, Math.random() * W, Math.random() * H, 3 + Math.random() * 8, "#ffffff", 0.85);
    for (i = 0; i < 70; i++) blob(ctx, W, Math.random() * W, Math.random() * H, 8 + Math.random() * 20, "#4a1202", 0.30);
    ctx.strokeStyle = "#380d02";
    ctx.lineCap = "round";
    for (i = 0; i < 44; i++) {
      x = Math.random() * W; y = Math.random() * H;
      ctx.save();
      ctx.globalAlpha = 0.3 + Math.random() * 0.25;
      ctx.lineWidth = 1.2 + Math.random() * 2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + (Math.random() - 0.5) * 34, y + (Math.random() - 0.5) * 34,
                           x + (Math.random() - 0.5) * 56, y + (Math.random() - 0.5) * 56);
      ctx.stroke();
      ctx.restore();
    }
    grain(ctx, W, H, 420, "#ffd23f", 0.25, 2);
    return new THREE.CanvasTexture(c);
  }

  // One blade arm as an outline, in texture pixels around the
  // centre: a curved spine from the core to the rim, with a width
  // that starts wide at the core and tapers steadily to a fine
  // point at the tip, the way the reference blades are shaped.
  function armSpine(A, t) {
    var ang = (A - 10 + 68 * Math.pow(t, 1.15)) * Math.PI / 180;
    var rad = 100 + 390 * Math.pow(t, 0.92);
    return [Math.cos(ang) * rad, Math.sin(ang) * rad];
  }
  function armWidth(t) { return 6 + 128 * Math.pow(1 - t, 1.25); }
  function armOutlinePts(b) {
    var A = b * 90, N = 26, spine = [], left = [], right = [], i, t;
    for (i = 0; i <= N; i++) spine.push(armSpine(A, i / N));
    for (i = 0; i <= N; i++) {
      t = i / N;
      var p = spine[i], q = spine[Math.min(N, i + 1)], s = spine[Math.max(0, i - 1)];
      var dx = q[0] - s[0], dy = q[1] - s[1], L = Math.hypot(dx, dy) || 1;
      var nx = -dy / L, ny = dx / L, w = armWidth(t) / 2;
      left.push([p[0] + nx * w, p[1] + ny * w]);
      right.push([p[0] - nx * w, p[1] - ny * w]);
    }
    return { outline: left.concat(right.slice().reverse()), left: left, right: right, spine: spine };
  }

  // The wing disc is a swirling disc of chakra with four blade arms
  // on it, shaped from the reference art: each arm is a long spiral
  // fin that rises from the core wide, sweeps a quarter turn around
  // the disc, and tapers to a fine point at the rim. The arms carry
  // the brightest fill and a bright line along the outer edge, over
  // a dimmer disc with swirl shading. No seals on the wings, ever:
  // the pattern lives only on the core sphere.
  function wingDiscTexture(mode) {
    var S = 1024, c = makeCanvas(S, S), ctx = c.getContext("2d");
    var cx = S / 2, i, a, rr;
    var P = {
      wind:   { grad: [[0, "rgba(255,255,255,0.98)"], [0.35, "rgba(223,247,255,0.96)"], [0.75, "rgba(168,228,255,0.92)"], [1, "rgba(140,215,255,0.55)"]],
                glow: "rgba(150,220,255,0.55)", edge: "rgba(255,255,255,0.9)",
                shade: "rgba(30,120,190,0.16)",
                disc: ["rgba(235,250,255,0.85)", "rgba(170,225,255,0.5)", "rgba(140,215,255,0.16)"],
                grain: [255, 255, 255] },
      magnet: { grad: [[0, "rgba(255,255,255,0.98)"], [0.35, "rgba(207,230,255,0.96)"], [0.75, "rgba(111,168,255,0.94)"], [1, "rgba(47,107,255,0.6)"]],
                glow: "rgba(90,150,255,0.55)", edge: "rgba(234,246,255,0.9)",
                shade: "rgba(8,30,140,0.18)",
                disc: ["rgba(210,232,255,0.85)", "rgba(100,160,255,0.5)", "rgba(47,107,255,0.16)"],
                grain: [188, 214, 255] },
      lava:   { grad: [[0, "rgba(255,248,220,0.98)"], [0.35, "rgba(255,210,63,0.96)"], [0.75, "rgba(255,122,26,0.94)"], [1, "rgba(230,60,0,0.6)"]],
                glow: "rgba(255,120,20,0.5)", edge: "rgba(255,243,196,0.92)",
                shade: "rgba(150,25,0,0.18)",
                disc: ["rgba(255,240,200,0.85)", "rgba(255,150,50,0.5)", "rgba(230,70,0,0.16)"],
                grain: [255, 220, 130] }
    }[mode];
    function pt(deg, r) {
      var t = deg * Math.PI / 180;
      return [cx + Math.cos(t) * r, cx + Math.sin(t) * r];
    }
    function puff(px, py, r, rgb, alpha) {
      var g = ctx.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + alpha + ")");
      g.addColorStop(1, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0)");
      ctx.fillStyle = g;
      ctx.fillRect(px - r, py - r, r * 2, r * 2);
    }
    // One blade arm, traced from the shared outline: wide at the
    // core, tapering steadily to a fine point at the rim. The same
    // outline drives ARM_POLYS below, so the sparkles fill the
    // arms too.
    function armPath(b) {
      var o = armOutlinePts(b).outline;
      ctx.moveTo(cx + o[0][0], cx + o[0][1]);
      for (var k = 1; k < o.length; k++) ctx.lineTo(cx + o[k][0], cx + o[k][1]);
      ctx.closePath();
    }
    function armsPath() {
      ctx.beginPath();
      for (var b = 0; b < 4; b++) armPath(b);
    }
    // The disc under the arms: a filled swirl of chakra, bright at
    // the heart and thinning at the rim, with darker and brighter
    // arcs turning through it
    var dg = ctx.createRadialGradient(cx, cx, 10, cx, cx, 472);
    dg.addColorStop(0, P.disc[0]);
    dg.addColorStop(0.62, P.disc[1]);
    dg.addColorStop(1, P.disc[2]);
    ctx.beginPath();
    ctx.arc(cx, cx, 472, 0, Math.PI * 2);
    ctx.fillStyle = dg;
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cx, 472, 0, Math.PI * 2);
    ctx.clip();
    for (i = 0; i < 30; i++) {
      a = Math.random() * Math.PI * 2;
      rr = 120 + Math.random() * 330;
      ctx.beginPath();
      ctx.arc(cx, cx, rr, a, a + 0.5 + Math.random() * 0.7);
      ctx.strokeStyle = Math.random() < 0.6 ? P.shade : "rgba(255,255,255,0.10)";
      ctx.lineWidth = 9 + Math.random() * 18;
      ctx.stroke();
    }
    ctx.restore();
    if (mode === "wind") {
      // Smooth wind pass: broad, soft swirl bands over the disc, so
      // the spinning disc reads as silky moving air like the
      // reference, not speckle.
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cx, 472, 0, Math.PI * 2);
      ctx.clip();
      for (i = 0; i < 16; i++) {
        a = Math.random() * Math.PI * 2;
        rr = 90 + Math.random() * 360;
        ctx.beginPath();
        ctx.arc(cx, cx, rr, a, a + 0.7 + Math.random() * 0.9);
        ctx.strokeStyle = Math.random() < 0.55 ? "rgba(255,255,255,0.10)" : P.shade;
        ctx.lineWidth = 42 + Math.random() * 62;
        ctx.lineCap = "round";
        ctx.stroke();
      }
      ctx.restore();
    }
    // For Lava, a broken ring of fire glow sits behind the arms
    if (mode === "lava") {
      for (i = 0; i < 110; i++) {
        a = (i / 110) * Math.PI * 2 + Math.random() * 0.05;
        rr = 452 + Math.random() * 42;
        puff(cx + Math.cos(a) * rr, cx + Math.sin(a) * rr, 20 + Math.random() * 30, [255, 110, 10], 0.10);
        if (Math.random() < 0.5) puff(cx + Math.cos(a) * rr, cx + Math.sin(a) * rr, 13 + Math.random() * 20, [214, 48, 0], 0.09);
      }
    }
    // Bright heart around the core
    var hg = ctx.createRadialGradient(cx, cx, 4, cx, cx, 175);
    hg.addColorStop(0, "rgba(255,255,255,0.34)");
    hg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, S, S);
    // Soft glow pass under the arms
    armsPath();
    ctx.save();
    ctx.shadowColor = P.glow;
    ctx.shadowBlur = 44;
    ctx.fillStyle = P.glow;
    ctx.fill();
    ctx.restore();
    // Arm fill: hot at the heart, style colour out to the tips
    var g = ctx.createRadialGradient(cx, cx, 8, cx, cx, 494);
    for (i = 0; i < P.grad.length; i++) g.addColorStop(P.grad[i][0], P.grad[i][1]);
    armsPath();
    ctx.fillStyle = g;
    ctx.fill();
    // Inner detail, clipped to the arms: flow shading sweeping
    // along each arm, then a light grain
    ctx.save();
    armsPath();
    ctx.clip();
    for (var b2 = 0; b2 < 4; b2++) {
      var sp = armOutlinePts(b2).spine;
      for (var j = -1; j <= 1; j += 2) {
        ctx.beginPath();
        for (var si = 2; si < sp.length - 1; si++) {
          var t2 = si / (sp.length - 1);
          var pp = sp[si], qq = sp[si + 1], ss = sp[si - 1];
          var ddx = qq[0] - ss[0], ddy = qq[1] - ss[1], LL = Math.hypot(ddx, ddy) || 1;
          var ox = -ddy / LL * j * armWidth(t2) * 0.3, oy = ddx / LL * j * armWidth(t2) * 0.3;
          if (si === 2) ctx.moveTo(cx + pp[0] + ox, cx + pp[1] + oy);
          else ctx.lineTo(cx + pp[0] + ox, cx + pp[1] + oy);
        }
        ctx.strokeStyle = P.shade;
        ctx.lineWidth = 13;
        ctx.lineCap = "round";
        ctx.stroke();
      }
    }
    if (mode === "wind") {
      // No grain speckle for Wind: a few large, faint sheen puffs
      // inside the arms keep the surface smooth.
      for (i = 0; i < 26; i++) {
        a = Math.random() * Math.PI * 2;
        rr = Math.pow(Math.random(), 0.7) * 440;
        puff(cx + Math.cos(a) * rr, cx + Math.sin(a) * rr,
             46 + Math.random() * 70, [255, 255, 255], 0.045);
      }
    } else {
      for (i = 0; i < 240; i++) {
        a = Math.random() * Math.PI * 2;
        rr = Math.pow(Math.random(), 0.7) * 452;
        puff(cx + Math.cos(a) * rr, cx + Math.sin(a) * rr,
             14 + Math.random() * 42, P.grain, 0.05 + Math.random() * 0.06);
      }
    }
    if (mode === "lava") {
      for (i = 0; i < 60; i++) {
        a = Math.random() * Math.PI * 2;
        rr = Math.pow(Math.random(), 0.7) * 430;
        puff(cx + Math.cos(a) * rr, cx + Math.sin(a) * rr, 5 + Math.random() * 12, [255, 243, 196], 0.5);
      }
    }
    ctx.restore();
    // Bright line along each arm's outer edge (the side farther
    // from the centre): the cutting edge
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (var b3 = 0; b3 < 4; b3++) {
      var oo = armOutlinePts(b3);
      function meanR(pts) {
        var s2 = 0;
        for (var mi = 0; mi < pts.length; mi++) s2 += Math.hypot(pts[mi][0], pts[mi][1]);
        return s2 / pts.length;
      }
      var outer = meanR(oo.left) > meanR(oo.right) ? oo.left : oo.right;
      for (var pass = 0; pass < 2; pass++) {
        ctx.beginPath();
        ctx.moveTo(cx + outer[0][0], cx + outer[0][1]);
        for (var k2 = 1; k2 < outer.length; k2++) ctx.lineTo(cx + outer[k2][0], cx + outer[k2][1]);
        ctx.strokeStyle = pass === 0 ? P.edge : "rgba(255,255,255,0.95)";
        ctx.lineWidth = pass === 0 ? 6 : 2;
        ctx.stroke();
      }
    }
    return new THREE.CanvasTexture(c);
  }

  var buttons = Array.prototype.slice.call(document.querySelectorAll(".style-btn"));
  function setStyle(name) {
    if (!STYLES[name]) return;
    currentStyle = name;
    for (var s = 0; s < fxList.length; s++) {
      fxList[s].colorBlend = 0;
      applyStyle(fxList[s], styleForSlot(s));
    }
    buttons.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-style") === name); });
    setStatus(STYLES[name].label + ". Fist to charge, open hand to release.");
  }
  buttons.forEach(function (b) {
    b.addEventListener("click", function () { setStyle(b.getAttribute("data-style")); });
  });
  window.addEventListener("keydown", function (ev) {
    var idx = parseInt(ev.key, 10);
    if (idx >= 1 && idx <= STYLE_ORDER.length) setStyle(STYLE_ORDER[idx - 1]);
  });
  fxList.forEach(function (fx) { applyStyle(fx, "classic"); });

  // ---------- Hand tracking, both hands ----------
  function dist(a, b) {
    var dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function readHand(fx, lm, now) {
    fx.target.has = true;
    fx.lastSeen = now;
    var cx, cy;
    if (fx.styleName === "wind") {
      // Wind test build, anchor studied from the original demo's
      // code: the centre is the mean of the wrist and the four
      // knuckles. On top of that, a hover offset along the wrist
      // to middle knuckle axis, so the disc floats above the palm
      // the way it does in the reference, instead of sitting in it.
      cx = (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5;
      cy = (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5;
      cx += (lm[9].x - lm[0].x) * 0.55;
      cy += (lm[9].y - lm[0].y) * 0.55;
    } else {
      cx = (lm[0].x + lm[5].x + lm[17].x) / 3;
      cy = (lm[0].y + lm[5].y + lm[17].y) / 3;
      cx += (lm[9].x - lm[0].x) * 0.35;
      cy += (lm[9].y - lm[0].y) * 0.35;
    }
    var palmW = dist(lm[5], lm[17]);
    var w = screenToWorld(1 - cx, cy);
    fx.target.x = w.x; fx.target.y = w.y;
    fx.target.radius = Math.max(40, Math.min(150, palmW * viewW * 1.15));
    var tips = [8, 12, 16, 20];
    var sum = 0;
    for (var i = 0; i < tips.length; i++) sum += dist(lm[tips[i]], lm[0]);
    fx.target.fist = (sum / tips.length) < palmW * 1.55;
  }

  function onResults(results) {
    var now = performance.now();
    var all = results.multiHandLandmarks || [];
    var seen = {};
    for (var i = 0; i < all.length && i < 2; i++) {
      var label = null;
      if (results.multiHandedness && results.multiHandedness[i]) label = results.multiHandedness[i].label;
      var slot = label === "Left" ? 0 : label === "Right" ? 1 : (seen[0] ? 1 : 0);
      if (seen[slot]) slot = 1 - slot;
      seen[slot] = true;
      readHand(fxList[slot], all[i], now);
    }
    for (var s = 0; s < fxList.length; s++) {
      if (!seen[s]) fxList[s].target.has = false;
    }
  }

  var video = document.getElementById("camera");
  var cameraStarted = false;
  try {
    var hands = new Hands({
      locateFile: function (file) {
        return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;
      }
    });
    hands.setOptions({
      maxNumHands: 2, modelComplexity: 1,
      minDetectionConfidence: 0.6, minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);
    var mpCamera = new Camera(video, {
      onFrame: function () { return hands.send({ image: video }); },
      width: 1280, height: 720
    });
    mpCamera.start().then(function () {
      cameraStarted = true;
      setStatus("Camera on. Show your open palm.");
    }).catch(function () {
      setStatus("Camera unavailable. This page needs a camera to show the Rasengan.");
    });
  } catch (err) {
    setStatus("Hand tracking unavailable. This page needs a camera to show the Rasengan.");
  }
  setTimeout(function () {
    if (!cameraStarted) setStatus("Show your open palm to the camera.");
  }, 6000);

  // ---------- Per-hand animation ----------
  function updateEffect(fx, dt, now) {
    var st = STYLES[fx.styleName];
    var live = fx.target.has && now - fx.lastSeen < 1200;
    fx.presence += ((live ? 1 : 0) - fx.presence) * Math.min(1, dt * (live ? 7 : 5));
    if (fx.presence < 0.02 && !live) { fx.group.visible = false; return false; }
    fx.group.visible = true;

    if (live) {
      var k = 1 - Math.pow(0.0001, dt);
      // Wind test build: the original demo lerps at 0.32 a frame,
      // much tighter than ours, so the effect sticks to the palm
      // instead of trailing behind it.
      if (fx.styleName === "wind") k = 1 - Math.pow(0.68, dt * 60);
      fx.pos.x += (fx.target.x - fx.pos.x) * k;
      fx.pos.y += (fx.target.y - fx.pos.y) * k;
      fx.pos.radius += (fx.target.radius - fx.pos.radius) *
        (fx.styleName === "wind" ? 1 - Math.pow(0.72, dt * 60) : k);
    }

    var chargeTarget = (live && fx.target.fist) ? 1 : 0;
    fx.charge += (chargeTarget - fx.charge) * Math.min(1, dt * 5);

    if (fx.wasFist && live && !fx.target.fist && fx.charge > 0.45 && fx.pulseT < 0) fx.pulseT = 0;
    fx.wasFist = live && fx.target.fist;
    var pulseScale = 1;
    if (fx.pulseT >= 0) {
      fx.pulseT += dt;
      var pt = fx.pulseT / 0.9;
      if (pt >= 1) fx.pulseT = -1;
      else pulseScale = 1 + Math.sin(pt * Math.PI) * (st.wings ? 1.9 : 0.55);
    }

    var R = fx.pos.radius * (1 - fx.charge * 0.24) * (0.72 + 0.28 * fx.presence);
    var flick = 1 + (Math.random() - 0.5) * st.flicker * (1 + fx.charge);
    // No idle bob for Wind: the reference effect sits still on the
    // palm, the bob made ours feel like it was drifting off it.
    var bob = fx.styleName === "wind" ? 0 : Math.sin(now * 0.0016) * 3.5;
    fx.group.position.set(fx.pos.x, fx.pos.y + bob, 0);
    fx.group.scale.set(R * flick * pulseScale, R * flick * pulseScale, R * flick * pulseScale);

    fx.sphereMat.opacity = fx.presence;
    fx.glow.material.opacity = (0.5 + fx.charge * 0.3 + (fx.pulseT >= 0 ? 0.25 : 0)) * fx.presence;
    // Wind test build: the shell speckle nearly off, so the core
    // reads as the smooth bright glow it is in the reference.
    fx.shellMat.opacity = (fx.styleName === "wind" ? 0.18 : 0.65) * fx.presence;
    fx.swirlMat.opacity = (st.wings ? 0.05 : 0.32 + fx.charge * 0.25) * fx.presence;
    fx.emberMat.opacity = 0.9 * fx.presence;
    fx.coreGlowMat.opacity = st.coreGlowO * (1 + fx.charge * 0.5) * fx.presence;

    fx.sphere.rotation.y += dt * st.spin * (1 + fx.charge * 1.7);
    fx.sphere.rotation.x = Math.sin(now * 0.0004) * 0.14;

    fx.spinAngle += dt * 2.4 * (1 + fx.charge * 1.4);
    for (var i = 0; i < fx.shellN; i++) {
      var phi = fx.shellPhi[i];
      var latSpeed = 0.45 + Math.sin(phi) * 0.9;
      var th = fx.shellTheta[i] + fx.spinAngle * latSpeed + fx.shellSeed[i] * 0.6;
      var sp = Math.sin(phi), r = fx.shellRad[i];
      fx.shellPos[i * 3] = Math.cos(th) * sp * r;
      fx.shellPos[i * 3 + 1] = Math.cos(phi) * r;
      fx.shellPos[i * 3 + 2] = Math.sin(th) * sp * r;
    }
    fx.shellGeo.attributes.position.needsUpdate = true;

    if (fx.colorBlend < 1) {
      fx.colorBlend = Math.min(1, fx.colorBlend + dt * 2.2);
      for (var j = 0; j < fx.shellN * 3; j++) {
        fx.shellCol[j] += (fx.shellTargetCol[j] - fx.shellCol[j]) * Math.min(1, dt * 7);
      }
      fx.shellGeo.attributes.color.needsUpdate = true;
    }

    var shTarget = st.shellScale || 1;
    var shNow = fx.shell.scale.x + (shTarget - fx.shell.scale.x) * Math.min(1, dt * 5);
    fx.shell.scale.set(shNow, shNow, shNow);
    fx.sphere.scale.set(shNow, shNow, shNow);
    fx.coreGlowSprite.scale.set(1.55 * shNow, 1.55 * shNow, 1);

    for (var s = 0; s < fx.swirlN; s++) {
      var a = fx.swirlAng[s] + fx.spinAngle * 1.9;
      fx.swirlPos[s * 3] = Math.cos(a) * fx.swirlRad[s];
      fx.swirlPos[s * 3 + 1] = fx.swirlY[s] * (1 - fx.charge * 0.4);
      fx.swirlPos[s * 3 + 2] = Math.sin(a) * fx.swirlRad[s];
    }
    fx.swirlGeo.attributes.position.needsUpdate = true;

    // Wing disc: spins, faster while charged and on release
    fx.bladeLevel += ((st.wings ? 1 : 0) - fx.bladeLevel) * Math.min(1, dt * 6);
    fx.bladeGroup.visible = fx.bladeLevel > 0.02;
    if (fx.bladeGroup.visible) {
      fx.bladeMat.opacity = fx.bladeOpacityBase * fx.bladeLevel * fx.presence;
      fx.bladeDiscMat.opacity = fx.discOpacityBase * fx.bladeLevel * fx.presence;
      fx.bladeSpin.rotation.z -= dt * (5.5 + fx.charge * 5) * (fx.pulseT >= 0 ? 1.6 : 1);
    }

    // Wind streaks shear around the disc, mist drifts at the rim,
    // all turning the same way as the disc
    fx.windGroup.visible = fx.bladeLevel > 0.02;
    if (fx.windGroup.visible) {
      fx.windAngle -= dt * (8 + fx.charge * 6) * (fx.pulseT >= 0 ? 1.5 : 1);
      fx.windMat.opacity = 0.38 * fx.bladeLevel * fx.presence;
      for (var w = 0; w < fx.windN; w++) {
        var wa = fx.windAng[w] + fx.windAngle * fx.windSpd[w];
        var wr = fx.windRad[w];
        var wz = Math.sin(fx.windAng[w] * 3) * 0.12;
        fx.windPos[w * 6] = Math.cos(wa) * wr;
        fx.windPos[w * 6 + 1] = Math.sin(wa) * wr;
        fx.windPos[w * 6 + 2] = wz;
        fx.windPos[w * 6 + 3] = Math.cos(wa + fx.windLen[w]) * wr * 1.05;
        fx.windPos[w * 6 + 4] = Math.sin(wa + fx.windLen[w]) * wr * 1.05;
        fx.windPos[w * 6 + 5] = wz * 0.6;
      }
      fx.windGeo.attributes.position.needsUpdate = true;
      for (var m = 0; m < fx.windMists.length; m++) {
        var mm = fx.windMists[m];
        mm.ang -= dt * mm.spd * (1 + fx.charge);
        mm.sprite.position.set(Math.cos(mm.ang) * mm.rad, Math.sin(mm.ang) * mm.rad, Math.sin(mm.ph) * 0.3);
        var msc = mm.scl * (1 + Math.sin(now * 0.001 + mm.ph) * 0.15);
        mm.sprite.scale.set(msc, msc * 0.8, 1);
        mm.sprite.material.opacity = mm.base * fx.bladeLevel * fx.presence;
      }
    }

    fx.smokeLevel += ((st.smoke || 0) - fx.smokeLevel) * Math.min(1, dt * 3);
    fx.smoke.material.opacity = fx.smokeLevel * fx.presence;
    var ss = 5.8 + Math.sin(now * 0.0011) * 0.35;
    fx.smoke.scale.set(ss, ss * 0.9, 1);
    fx.smoke.position.x = Math.sin(now * 0.0006) * 0.18;

    if (fx.embers.visible) {
      for (var e2 = 0; e2 < fx.emberMax; e2++) {
        fx.emberLife[e2] -= dt;
        if (fx.emberLife[e2] <= 0) { respawnEmber(fx, e2, 1.05); continue; }
        fx.emberPos[e2 * 3] += fx.emberVel[e2 * 3] * dt * (0.4 + fx.charge * 0.5);
        fx.emberPos[e2 * 3 + 1] += fx.emberVel[e2 * 3 + 1] * dt * (0.4 + fx.charge * 0.5);
        fx.emberPos[e2 * 3 + 2] += fx.emberVel[e2 * 3 + 2] * dt * (0.4 + fx.charge * 0.5);
        fx.emberVel[e2 * 3 + 1] -= dt * 0.55;
      }
      fx.emberGeo.attributes.position.needsUpdate = true;
    }

    if (fx.orbGroup.visible) {
      for (var o = 0; o < fx.orbMeshes.length; o++) {
        var oa = fx.spinAngle * 0.6 + (o / fx.orbMeshes.length) * Math.PI * 2;
        // Tilted ring: the orbs swing above, below and behind the
        // core instead of crossing its face
        fx.orbMeshes[o].position.set(Math.cos(oa) * 1.25, Math.sin(oa) * 0.62, Math.sin(oa) * 1.05);
        fx.orbMeshes[o].material.opacity = fx.presence;
        fx.orbMeshes[o].children[0].material.opacity = 0.45 * fx.presence;
      }
    }

    var gs = 3.3 + fx.charge * 0.7 + Math.sin(now * 0.004) * 0.1;
    fx.glow.scale.set(gs, gs, 1);
    return live;
  }

  var lastT = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    var now = performance.now();
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    var anyLive = false;
    for (var i = 0; i < fxList.length; i++) {
      if (updateEffect(fxList[i], dt, now)) anyLive = true;
    }
    if (anyLive) {
      if (currentStyle === "dual") setStatus("Dual. Left hand Magnet, right hand Lava. Fist either hand to charge it.");
      else setStatus(STYLES[currentStyle].label + ". Fist to charge, open hand to release.");
    } else if (cameraStarted) {
      setStatus("No palm. The Rasengan is gone. Show your open palm to bring it back.");
    }
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
